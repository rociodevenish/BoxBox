name: Verification
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            tools/auth-emulator/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci --prefix src/frontend
      - run: npm ci --prefix tools/auth-emulator
      - run: node src/frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: node tools/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: .tools/reports
          retention-days: 7
